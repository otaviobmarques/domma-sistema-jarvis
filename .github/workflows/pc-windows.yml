name: App de PC (Windows)

# Gera o instalador do Jarvis para Windows e publica numa Release do GitHub.
# Dispara quando algo muda em apps/pc na main, ou manualmente (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "apps/pc/**"
      - ".github/workflows/pc-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/pc/src-tauri -> target

      - name: Instalar dependências
        run: npm ci --workspace @jarvis/pc --include-workspace-root=false

      # Palavra de ativação ("Tavinho"): reconhecimento de voz local com o Vosk.
      # Os arquivos são conferidos pelo SHA-256 antes de entrar no instalador.
      - name: Vosk (palavra de ativação)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "apps/pc/src-tauri/resources/vosk"
          $tmp = Join-Path $env:RUNNER_TEMP "vosk"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $arquivos = @(
            @{ url = "https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip"; nome = "lib.zip"; sha = "f1dcc9cca460630f81ea8f71794f69c80bed6556d2a4e6237b5785e1d2dff34b" },
            @{ url = "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip"; nome = "modelo.zip"; sha = "6e1ce909032e1afa7a88e68a3d628ecafff302bdf195befab308826c395e93b7" }
          )
          foreach ($a in $arquivos) {
            $p = Join-Path $tmp $a.nome
            Invoke-WebRequest -Uri $a.url -OutFile $p
            $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $a.sha) { throw "SHA-256 inesperado para $($a.url): $h" }
            Expand-Archive -Path $p -DestinationPath (Join-Path $tmp ($a.nome -replace '\.zip$','')) -Force
          }
          Get-ChildItem (Join-Path $tmp "lib/vosk-win64-0.3.45") -Filter *.dll | Copy-Item -Destination $dest
          Copy-Item -Recurse (Join-Path $tmp "modelo/vosk-model-small-pt-0.3") (Join-Path $dest "modelo")
          Get-ChildItem -Recurse $dest | Select-Object FullName, Length

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = (Get-Content apps/pc/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "versao=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/pc
          tauriScript: npx tauri
          tagName: pc-v${{ steps.versao.outputs.versao }}
          releaseName: "Jarvis para Windows v${{ steps.versao.outputs.versao }}"
          releaseBody: |
            Instalador do Jarvis by Domma Tecnologia para Windows.

            1. Baixe o arquivo **Jarvis_${{ steps.versao.outputs.versao }}_x64-setup.exe** abaixo e instale.
            2. Abra o Jarvis (ícone na bandeja ou **Ctrl+Espaço**).
            3. No painel (jarvis.dommasistemas.com.br → Dispositivos), gere um código de pareamento e digite no app.
          releaseDraft: false
          prerelease: false
