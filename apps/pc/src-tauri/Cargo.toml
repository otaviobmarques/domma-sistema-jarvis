[package]
name = "jarvis-pc"
version = "0.1.6"
description = "Jarvis by Domma Tecnologia — app de PC"
authors = ["Domma Tecnologia"]
edition = "2021"

[lib]
name = "jarvis_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
dirs = "5"
opener = "0.7"
trash = "5"
enigo = "0.2"
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
cpal = "0.15"
hound = "3"
libloading = "0.8"
keyring = { version = "3", features = ["windows-native", "linux-native", "apple-native"] }
hostname = "0.4"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
